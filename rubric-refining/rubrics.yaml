  name: Search Motivation, Necessity, and Alignment
  description: 'Inspect the <think> block immediately preceding each <search> tag,
    or the initial <think> block if no search is performed. Does the model identify
    an information gap or unresolved uncertainty that cannot be resolved from the
    question stem alone, thereby justifying the search or acknowledging a limitation?
    If a search is performed, is it epistemically necessary (not redundant or for
    already known facts) and does the query text directly target the specific clinical
    concept or uncertainty articulated in that <think> block? Score 0 if the model
    searches without explicitly naming a gap, or if it names a gap but the query terms
    differ substantially from the stated gap (e.g., <think> asks about "drug mechanism"
    but <search> contains "epidemiology incidence"). Also score 0 if <search> appears
    with no preceding <think> reasoning, if <think> contains only answer-option listing
    with no articulated motivation, if <think> already knows the answer and issues
    <search> for verification without explaining why, or if multiple <search> tags
    address the same resolved question without new uncertainty. If the model decides
    not to search despite genuine uncertainty that would affect the answer, answering
    purely from parametric knowledge without acknowledging the gap, this is also scored
    0. Score 1 if <think> explicitly states an unresolved claim, missing datum, or
    specific information gap immediately before <search>, demonstrating a genuine
    uncertainty about a clinically important fact or a need to confirm a claim, AND
    the query maps precisely to this stated knowledge gap using relevant clinical
    terminology (e.g., <search>diastolic RV collapse echocardiographic cardiac tamponade
    specificity</search>). A query partially addressing the gap or being under-specified
    (e.g., <search>pericarditis</search> when the gap is specifically about echocardiographic
    differentiation from tamponade) is also scored 0.

    '
