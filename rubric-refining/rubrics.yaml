- id: D_d1
  dimension: 4
  name: Retrieved evidence use and priority
  description: 'Inspect all [Tn-Rn] citations in <think> and <answer> blocks, and
    the model''s overall reasoning when search has been performed. Does the model
    use retrieved evidence for appropriate epistemic purposes, rather than decoratively,
    and prioritize it over parametric knowledge when directly relevant? MET: Every
    citation anchors a specific claim that would be unsupported if the citation were
    removed; no citation is appended to a sentence that is self-evident or already
    established by other in-text reasoning. Furthermore, where a [Tn-Rn] passage directly
    addresses a claim, <think> references and follows that passage rather than substituting
    "I recall that…" or "It is known that…" for the retrieved content. UNMET: One
    or more citations in <think> or <answer> are used purely for rhetorical support
    — e.g., "[T1-R1]" is appended to a well-known textbook fact ("the pericardium
    surrounds the heart [T1-R1]") that requires no evidence citation, while clinically
    important claims nearby are left uncited. UNMET also if <think> states a clinical
    claim using parametric knowledge (e.g., "As I know from training, tamponade causes
    diastolic RV collapse") for a concept that a retrieved [Tn-Rn] passage explicitly
    addresses — effectively ignoring the retrieved evidence in favour of memory, or
    explicitly disagreeing with a retrieved passage without citing a stronger source.

    '
  type: binary
  precondition: answer
  scale_labels:
  - Unmet
  - Met
  active: false
  auto_drafted: true
