- id: A_d1
  dimension: 1
  name: Information-Gap Justification and Query Alignment
  description: 'Inspect the Turn 1 <think> block and any subsequent <search> tags.
    When the model decides to issue a <search>, does it first name a specific piece
    of information or unresolved uncertainty that cannot be resolved from the question
    stem alone, thereby justifying the search? If a search is performed, does the
    query text directly target the specific clinical concept or uncertainty articulated
    in that <think> block? Score 0 if the model searches without naming a gap, OR
    if the model names a gap but the query terms differ substantially from the stated
    gap (e.g., <think> asks about "drug mechanism" but <search> contains "epidemiology
    incidence"). Score 1 if the model explicitly names a gap, but the query partially
    addresses the gap or is under-specified (e.g., <search>pericarditis</search> when
    the gap is specifically about echocardiographic differentiation from tamponade).
    Score 2 if the model explicitly names a specific, unresolved information gap AND
    the query text maps precisely to this stated knowledge gap using the most relevant
    clinical terminology (e.g., <search>diastolic RV collapse echocardiographic cardiac
    tamponade specificity</search>). If the model decides not to search despite genuine
    uncertainty that would affect the answer, answering purely from parametric knowledge
    without acknowledging the gap, this is also scored 0.

    '
  type: ordinal3
  precondition: search_performed
  scale_labels:
  - No valid gap identified or query misalignment
  - Gap identified but query is partial or underspecified
  - Explicit gap identified and precisely targeted query
  active: false
  auto_drafted: true
  notes: Auto-merged from [A6] + [B3]. Pearson r=0.784 (n=186) ≥ threshold 0.75
  pruning_history:
