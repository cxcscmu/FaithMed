- id: E1
  dimension: 5
  name: Retrieved source verifiability
  description: 'Inspect every [Tn-Rn] reference appearing in <think> and <answer>.
    Does each citation index correspond to a passage that actually appeared in the
    retrieved results for that turn number? MET: Every citation in <think> and <answer>
    matches a real [Tn-Rn] entry in the trajectory — e.g., if Turn 1 retrieved results
    T1-R1 through T1-R6, then no citation in the trajectory references [T1-R7] or
