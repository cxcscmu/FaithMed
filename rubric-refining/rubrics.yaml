- id: D_d2
  dimension: 4
  name: Claim Substantiation and Faithfulness
  description: 'Inspect both the <think> blocks and the <answer> block. Evaluate the
    extent to which affirmative clinical claims are substantiated by inline [Tn-Rn]
    citations and whether those citations directly and specifically support the claims.
    Score 0 if fewer than half of substantive clinical claims carry [Tn-Rn] citations
    (when a search has been performed), or if one or more citations in <think> or
    <answer> are attached to claims the passage does not support — e.g., <answer>
    asserts "pulsus paradoxus is pathognomonic for tamponade" with no citations despite
    search having returned relevant [T1-Rn] passages, or cites [T1-R3] (a pathophysiology
    review) for the specific claim that "pulsus paradoxus >10 mmHg is diagnostic",
    when [T1-R3] discusses only general pericardial disease management without stating
    that threshold. Score 1 if 50–90% of claims carry citations but one or more key
    claims in the <answer> block lack [Tn-Rn] support, OR if most citations are congruent
    but one or two are only loosely related — e.g., a passage about constrictive pericarditis
    aetiology is cited to support a claim about treatment efficacy. Score 2 if >90%
    of affirmative clinical claims in both <think> and <answer> sections carry inline
    [Tn-Rn] citations AND every [Tn-Rn] citation in both <think> and <answer> directly
    and specifically supports its attached claim.

    '
  type: ordinal3
