- id: D6
  dimension: 4
  name: Non-retrieval claim discipline
  description: 'Inspect all clinical claims in <think> and <answer> that carry no
    [Tn-Rn] citation. Are all uncited claims restricted to high-confidence, well-established
    medical knowledge (e.g., basic physiology, textbook pharmacology), rather than
    uncertain or high-stakes assertions? MET: Every uncited claim in <think> and <answer>
    is a widely accepted medical fact that any medical professional would regard as
    non-controversial — e.g., "warfarin inhibits vitamin K-dependent clotting factors"
    requires no citation. UNMET: <think> or <answer> makes an uncited assertion about
    comparative drug efficacy, guideline-level recommendations, specific dosing thresholds,
    or prognostic estimates that would be considered contestable or uncertain — e.g.,
    "oral TXA is equally effective as IV TXA for epistaxis in anticoagulated patients"
    stated without a [Tn-Rn] citation.

    '
  type: binary
  precondition: answer
  scale_labels:
