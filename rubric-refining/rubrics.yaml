- id: E2
  dimension: 5
  name: Uncertainty calibration
  description: 'Inspect the <think> blocks and <answer> block. Does the model 
    explicitly acknowledge limitations in the retrieved information or express
    appropriate uncertainty before drawing a conclusion? MET: At least one
    explicit hedge appears in <think> or <answer> whenever the evidentiary basis is
    weak — e.g., "the retrieved passages do not confirm X; based on clinical reasoning
    I tentatively conclude Y", or "limited data support this — evidence suggests…"
    in <answer> when the trajectory contained only peripheral [Tn-Rn] passages. UNMET:
    <think> or <answer> states a clinical conclusion with high certainty (e.g., "the
    mechanism is definitively X", "this is clearly Y") when the retrieved [Tn-Rn]
    passages are off-topic, sparse, or absent — as occurred in the 4-turn trajectory
    where the model stated "the answer is likely D (Florida)" with no direct state-level
    data retrieved.

    '
  type: binary
  precondition: answer
  scale_labels:
  - UNMET
  - MET
  active: true
- id: E3
  dimension: 5
  name: Overclaim avoidance
  description: 'Inspect all <think> blocks and the <answer> block. Does the model
    avoid presenting weak or indirect [Tn-Rn] passages (case reports, narrative review
    abstracts, WikiDoc entries, non-peer-reviewed summaries) as definitive clinical
    evidence? MET: When a cited [Tn-Rn] passage comes from a weak source (e.g., "Data
    Source: WikiDoc guideline"), <think> or <answer> qualifies its evidentiary weight
    — e.g., "T1-R6 is a WikiDoc guideline summary; I use it for orientation, not as
    primary evidence". UNMET: <think> or <answer> cites a WikiDoc entry, single case
    report, or abstract as if it were an RCT or society clinical practice guideline,
    attributing diagnostic or therapeutic conclusions to it without qualification.

    '
  type: binary
  precondition: answer
  scale_labels:
  - UNMET
  - MET
  active: false
- id: E4
  dimension: 5
  name: Premature closure avoidance
  description: 'Inspect the final <think> block immediately before <answer>. Does
    the model avoid committing definitively to a diagnosis or management decision
    when the retrieved [Tn-Rn] evidence leaves multiple answer options plausible?
    MET: Final <think> block either (a) explains why each competing answer option
    can be excluded based on [Tn-Rn] evidence, or (b) acknowledges residual uncertainty
    before selecting \boxed{X}. UNMET: Final <think> block states the answer with
    full certainty (e.g., "therefore the answer is A") without addressing competing
    options or residual ambiguity, despite [Tn-Rn] passages not unambiguously distinguishing
    between two or more plausible options — e.g., selecting tamponade over constrictive
    pericarditis when both share the retrieved echocardiographic features cited.

    '
  type: binary
  precondition: answer
  scale_labels:
  - UNMET
  - MET
  active: true
- id: E5
  dimension: 5
  name: Preference-sensitive decision integration
  description: 'Inspect the <answer> block. When the clinical scenario involves a
    management decision where patient values, goals, tolerability, or preferences
    are clinically relevant (e.g., choice between anticoagulation agents, surgical
    vs. medical management, end-of-life interventions), does <answer> acknowledge
    that the preferred choice may depend on patient-specific factors beyond clinical
    evidence alone? MET: <answer> contains a statement such as "the choice between
    X and Y should also reflect the patient''s preferences regarding monitoring burden
    / tolerability / goals of care". UNMET: <answer> presents a single management
    option as universally correct for a scenario that involves a tradeoff where patient
    preferences are clinically material — e.g., recommending anticoagulation in a
    patient with bleeding risk without noting the preference-sensitive nature of the
    risk-benefit decision.

    '
